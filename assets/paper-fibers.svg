<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" preserveAspectRatio="none">
  <defs>
    <filter id="paper-fibers" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.01 0.19" numOctaves="4" seed="23" result="fibers"/>
      <feColorMatrix in="fibers" type="matrix" values="
        0.22 0 0 0 0.34
        0 0.2 0 0 0.29
        0 0 0.2 0 0.31
        0 0 0 0.13 0"/>
    </filter>
    <linearGradient id="soft-crease" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="0.47" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#5b4a50" stop-opacity="0.025"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" fill="#716268" filter="url(#paper-fibers)"/>
  <rect width="640" height="480" fill="url(#soft-crease)"/>
</svg>
